<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-label="RaiT 평가 시스템 계산 파이프라인 — AI 응답이 Judge 프롬프트에서 8축 JSON 점수로 채점되고, Calculator가 simple·weight·cutoff·hybrid 4가지 방식으로 집계한 뒤, Filter가 도메인별 정책 설정(target score·cutoff·weight)을 적용해 과락 여부를 판정하고, 최종 PASS 또는 FAIL을 출력한다">
  <defs>
    <marker id="p5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8db0" />
    </marker>
    <marker id="p5-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8710a" />
    </marker>
  </defs>

  <rect width="1180" height="460" fill="#12203a" />

  <text x="20" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#eaf0fb">PRJ_05 · RaiT 계산 파이프라인</text>

  <line x1="0" y1="202" x2="18" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#p5-arrow)" />
  <text x="2" y="192" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#7f8db0">AI 응답</text>

  <!-- Judge 프롬프트 -->
  <rect x="20" y="170" width="160" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="100" y="196" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#eaf0fb">Judge 프롬프트</text>
  <text x="100" y="213" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="9.5" fill="#b7c3da">8축 JSON 채점 (llm_judge.py)</text>

  <!-- Calculator -->
  <line x1="180" y1="202" x2="198" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#p5-arrow)" />
  <rect x="200" y="170" width="180" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="290" y="196" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#eaf0fb">Calculator</text>
  <text x="290" y="213" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="9.5" fill="#b7c3da">simple · weight · cutoff · hybrid</text>

  <!-- Filter -->
  <line x1="380" y1="202" x2="398" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#p5-arrow)" />
  <rect x="400" y="170" width="150" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="475" y="196" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#eaf0fb">Filter</text>
  <text x="475" y="213" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="9.5" fill="#b7c3da">과락 판정 (filter.py)</text>

  <!-- PASS/FAIL -->
  <line x1="550" y1="202" x2="568" y2="202" stroke="#e8710a" stroke-width="1.75" marker-end="url(#p5-arrow-accent)" />
  <rect x="570" y="170" width="180" height="64" rx="8" fill="#1b2a4a" stroke="#e8710a" stroke-width="2" />
  <text x="660" y="198" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#ff8c2e">PASS / FAIL</text>
  <text x="660" y="215" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">최종 배포 판정</text>

  <!-- Policy Config (accent, feeds Filter) -->
  <rect x="330" y="320" width="290" height="64" rx="8" fill="#1b2a4a" stroke="#e8710a" stroke-width="2" />
  <text x="475" y="348" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#ff8c2e">Policy Config</text>
  <text x="475" y="365" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">도메인별 target_score · cutoff · weight</text>
  <path d="M475,320 L475,290 L475,234" fill="none" stroke="#e8710a" stroke-width="1.75" marker-end="url(#p5-arrow-accent)" />
  <text x="486" y="286" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">정책 기준 공급</text>

  <!-- legend -->
  <line x1="20" y1="430" x2="52" y2="430" stroke="#7f8db0" stroke-width="1.5" />
  <text x="60" y="434" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b7c3da">계산 실행 경로</text>
  <line x1="220" y1="430" x2="252" y2="430" stroke="#e8710a" stroke-width="1.75" />
  <text x="260" y="434" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">도메인 정책 · 최종 판정</text>
  <text x="20" y="450" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7f8db0">출처: src/engine/calculator.py, src/engine/filter.py, src/runner/llm_judge.py, config/policy_config.json</text>
</svg>
