<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-label="VOC 멀티에이전트 파이프라인 아키텍처 — VOC 입력이 Interpreter, Retriever, Summarizer, Evaluator, Critic, Improver 6개 에이전트를 순서대로 거치고, Evaluator 산출물이 별도의 독립 LLM Judge에도 전달되어, 내부 파이프라인 점수와 독립 Judge의 5축 채점이 함께 배포 판정으로 모인다">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8db0" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8710a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="460" fill="#12203a" />

  <!-- title -->
  <text x="20" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#eaf0fb">PRJ_01 · 멀티에이전트 QA 파이프라인 구조</text>

  <!-- incoming stub -->
  <line x1="0" y1="202" x2="18" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="4" y="192" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#7f8db0">고객 문의</text>

  <!-- main agent row -->
  <!-- VOC 입력 -->
  <rect x="20" y="170" width="110" height="64" rx="8" fill="#1b2a4a" stroke="#33466b" stroke-width="1.5" />
  <text x="75" y="207" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">VOC 입력</text>

  <!-- Interpreter -->
  <line x1="130" y1="202" x2="158" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="160" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="225" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Interpreter</text>
  <text x="225" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">의도 해석</text>

  <!-- Retriever -->
  <line x1="290" y1="202" x2="308" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="310" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="375" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Retriever</text>
  <text x="375" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">근거 검색</text>

  <!-- Summarizer -->
  <line x1="440" y1="202" x2="458" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="460" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="525" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Summarizer</text>
  <text x="525" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">요약 생성</text>

  <!-- Evaluator -->
  <line x1="590" y1="202" x2="608" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="610" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="675" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Evaluator</text>
  <text x="675" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">품질 채점</text>

  <!-- Critic -->
  <line x1="740" y1="202" x2="758" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="760" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="825" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Critic</text>
  <text x="825" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">리스크 탐지</text>

  <!-- Improver -->
  <line x1="890" y1="202" x2="908" y2="202" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="910" y="170" width="130" height="64" rx="8" fill="#243657" stroke="#33466b" stroke-width="1.5" />
  <text x="975" y="200" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#eaf0fb">Improver</text>
  <text x="975" y="216" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">개선안 생성</text>

  <!-- Evaluator -> Independent Judge (accent path) -->
  <path d="M675,234 L675,270 L660,270 L660,318" fill="none" stroke="#e8710a" stroke-width="1.75" marker-end="url(#arrow-accent)" />
  <text x="685" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">산출물 전달</text>

  <!-- Independent Judge box (accent) -->
  <rect x="540" y="320" width="240" height="64" rx="8" fill="#1b2a4a" stroke="#e8710a" stroke-width="2" />
  <text x="660" y="348" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#ff8c2e">독립 LLM Judge</text>
  <text x="660" y="365" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">정확성·요약충실성·정책구체성·유용성·안전성 5축</text>

  <!-- Improver -> 배포 판정 (internal score, muted path) -->
  <path d="M975,234 L975,270 L1030,270 L1030,318" fill="none" stroke="#7f8db0" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="985" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#7f8db0">내부 점수</text>

  <!-- Judge -> 배포 판정 (accent path) -->
  <line x1="780" y1="352" x2="928" y2="352" stroke="#e8710a" stroke-width="1.75" marker-end="url(#arrow-accent)" />
  <text x="798" y="342" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">독립 채점 JSON (5축)</text>

  <!-- 배포 판정 box -->
  <rect x="930" y="314" width="200" height="76" rx="8" fill="#1b2a4a" stroke="#e8710a" stroke-width="2" />
  <text x="1030" y="343" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#eaf0fb">배포 판정</text>
  <text x="1030" y="360" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">배포가능 · 조건부보류 ·</text>
  <text x="1030" y="374" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#b7c3da">개선필요 · 보류(HOLD)</text>

  <!-- legend -->
  <line x1="20" y1="430" x2="52" y2="430" stroke="#7f8db0" stroke-width="1.5" />
  <text x="60" y="434" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b7c3da">내부 파이프라인 경로</text>
  <line x1="230" y1="430" x2="262" y2="430" stroke="#e8710a" stroke-width="1.75" />
  <text x="270" y="434" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">독립 LLM Judge 개입 경로 (2차 검수 레이어)</text>
</svg>
