<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-label="라이브 E2E VOC 18건에 대한 독립 LLM Judge 채점 결과 막대그래프. 총점은 68점에서 88점 사이, 평균 81.2점으로 배포 기준선 95점에 전 건 미달했다. 13건은 조건부 배포 보류, 4건은 주요 개선 필요, 1건(TC-16)은 배포 보류로 판정됐다">
