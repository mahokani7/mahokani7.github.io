  <g font-family="JetBrains Mono, Consolas, monospace" font-size="9.5" fill="#7f8db0" text-anchor="middle">
    <text x="800" y="354">0</text>
    <text x="864" y="354">10</text>
    <text x="928" y="354">20</text>
    <text x="992" y="354">30</text>
    <text x="1056" y="354">40</text>
    <text x="1118" y="354">50ms</text>
  </g>

  <!-- avg range bar 10-40ms -->
  <rect x="864" y="200" width="192" height="26" rx="4" fill="#f0b429" />
  <text x="960" y="217" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#1b2a4a">평균 10~40ms</text>

  <!-- p95 range bar 13-21ms -->
  <rect x="883.2" y="250" width="51.2" height="26" rx="4" fill="#e8710a" />
  <text x="1010" y="267" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#ff8c2e">p95 13~21ms</text>

  <text x="758" y="300" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7f8db0" style="white-space:pre">규칙 기반 경로(use_rule_based:true)로</text>
  <text x="758" y="315" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7f8db0">우선 측정한 값. LLM 호출 포함 구간은</text>
  <text x="758" y="330" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7f8db0">지연이 더 클 수 있음(문서 명시).</text>

  <text x="20" y="440" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#7f8db0">출처: docs/performance_report.md (k6, 10 VUs · 30초 · 총 600 요청, 2026-07-07 실측 예시)</text>
</svg>
