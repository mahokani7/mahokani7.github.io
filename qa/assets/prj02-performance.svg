<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-label="k6 성능 테스트 결과. 10 가상 사용자, 30초 동안 600건 요청, 오류율 0%. 평균 응답시간 10~40ms, p95 응답시간 13~21ms로 배포 판정 기준인 1000ms보다 훨씬 낮아 여유 있게 통과했다">
  <rect width="1180" height="460" fill="#12203a" />

  <text x="20" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#eaf0fb">PRJ_02 · k6 성능 테스트 결과 (10 VUs · 30s · 2026-07-07 실측)</text>

  <!-- stat cards -->
  <g font-family="JetBrains Mono, Consolas, monospace">
    <rect x="20" y="46" width="150" height="58" rx="6" fill="#1b2a4a" stroke="#33466b" />
    <text x="34" y="70" font-size="20" font-weight="800" fill="#e8710a">600</text>
    <text x="34" y="90" font-size="10.5" fill="#b7c3da">총 요청 수</text>

    <rect x="182" y="46" width="150" height="58" rx="6" fill="#1b2a4a" stroke="#33466b" />
    <text x="196" y="70" font-size="20" font-weight="800" fill="#3fd08a">0%</text>
    <text x="196" y="90" font-size="10.5" fill="#b7c3da">오류율</text>

    <rect x="344" y="46" width="200" height="58" rx="6" fill="#1b2a4a" stroke="#33466b" />
    <text x="358" y="70" font-size="17" font-weight="800" fill="#eaf0fb">10 VUs · 30s</text>
    <text x="358" y="90" font-size="10.5" fill="#b7c3da">부하 조건</text>

    <rect x="558" y="46" width="150" height="58" rx="6" fill="#1b2a4a" stroke="#e8710a" stroke-width="1.5" />
    <text x="572" y="70" font-size="17" font-weight="800" fill="#ff8c2e">PASS</text>
    <text x="572" y="90" font-size="10.5" fill="#b7c3da">판정 (기준 1000ms)</text>
  </g>

  <!-- main scale: 0-1000ms (plot area x=70~700, separate from zoom inset at x>=740) -->
  <text x="20" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" fill="#b7c3da">전체 스케일 (0 – 1000ms, 판정 기준선 포함)</text>
  <g stroke="#2a3c5f" stroke-width="1">
    <line x1="70" y1="230" x2="700" y2="230" />
    <line x1="196" y1="160" x2="196" y2="230" />
    <line x1="322" y1="160" x2="322" y2="230" />
    <line x1="448" y1="160" x2="448" y2="230" />
    <line x1="574" y1="160" x2="574" y2="230" />
  </g>
  <line x1="70" y1="160" x2="70" y2="230" stroke="#33466b" stroke-width="1" />
  <line x1="700" y1="160" x2="700" y2="230" stroke="#ff5d6c" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="700" y="152" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#ff8c2e">판정 기준 1000ms →</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="9.5" fill="#7f8db0" text-anchor="middle">
    <text x="70" y="244">0</text>
    <text x="196" y="244">200</text>
    <text x="322" y="244">400</text>
    <text x="448" y="244">600</text>
    <text x="574" y="244">800</text>
    <text x="700" y="244">1000ms</text>
  </g>

  <!-- avg bar: 10-40ms mapped onto 0-1000 (plot width 630px) -->
  <rect x="76.3" y="176" width="18.9" height="18" rx="3" fill="#f0b429" />
  <!-- p95 bar: 13-21ms -->
  <rect x="78.2" y="200" width="5" height="18" rx="3" fill="#e8710a" />
  <line x1="95" y1="185" x2="260" y2="185" stroke="#7f8db0" stroke-width="1" stroke-dasharray="3 3" />
  <text x="266" y="189" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b7c3da">평균 10~40ms — 눈에 안 보일 만큼 기준 대비 여유 있음</text>
  <line x1="83" y1="209" x2="260" y2="209" stroke="#7f8db0" stroke-width="1" stroke-dasharray="3 3" />
  <text x="266" y="213" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b7c3da">p95 13~21ms — 기준 1000ms 대비 약 20~40배 여유</text>

  <!-- zoom inset: 0-50ms detail -->
  <rect x="740" y="140" width="400" height="230" rx="8" fill="#0d1526" stroke="#33466b" stroke-width="1.25" />
  <text x="758" y="166" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="700" fill="#eaf0fb">확대 보기 (0 – 50ms)</text>

